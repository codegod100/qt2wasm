[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qt2wasm"
version = "0.7.2"
description = "Build Qt C++ into WASI WebAssembly components"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
fonts = ["fonttools"]
test = ["pytest", "wasmtime"]
docs = ["zensical"]

[project.scripts]
qt2wasm = "qt2wasm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["qt2wasm"]

# The CMake module, headers and runtime sources the build driver needs,
# installed next to the Python code (qt2wasm/_data/...).
[tool.hatch.build.targets.wheel.force-include]
"cmake" = "qt2wasm/_data/cmake"
"include" = "qt2wasm/_data/include"
"runtime" = "qt2wasm/_data/runtime"
