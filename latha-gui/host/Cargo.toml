[package]
name = "latha-host"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-only OR LGPL-3.0-only"
description = "latha:gui component host on wasmtime, with a C API for latha-gui"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
wasmtime = { version = "50", default-features = false, features = ["component-model", "cranelift", "parallel-compilation", "runtime", "std", "addr2line", "demangle"] }
wasmtime-wasi = "50"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16
