[package]
name = "latha-host"
version = "0.3.0"
edition = "2021"
license = "LGPL-2.1-only OR LGPL-3.0-only"
description = "latha:gui component host on wasmtime, with a C API for latha-gui"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
wasmtime = { version = "50", default-features = false, features = ["component-model", "cranelift", "parallel-compilation", "runtime", "std", "addr2line", "demangle", "gc", "gc-drc", "incremental-cache"] }
wasmtime-wasi = "50"
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
# The system libzstd (pkg-config), not a static copy: Qt links libzstd too, and the static one's hidden
# symbols clash with it at link time.
zstd = { version = "0.13", features = ["zstdmt", "pkg-config"] }
target-lexicon = "0.13"
wasmparser = { version = "0.261", default-features = false, features = ["std", "component-model"] }

[[bin]]
name = "latha-run"
path = "src/bin/latha-run.rs"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16
