# Perry 0.5.1665 (@perryts/perry from npm): compiles TypeScript to native
# executables with LLVM, with a native UI toolkit (perry/ui maps to GTK4 on
# Linux) and an embedded WebAssembly interpreter (wasmi). qt2wasm uses it to
# run a Qt component's core module inside a native GTK4 app.
#
# The prebuilt compiler, runtime/stdlib/GTK4/wasm-host archives and the native
# extension pack (node:http, net, ws, zlib, ...) come from npm, so a compile
# never downloads anything. Everything Perry links against comes from
# conda-forge: GTK4, GStreamer, PulseAudio, libsoup and the conda C toolchain
# (gcc_linux-64 + sysroot, plus clang, which Perry uses as an assembler). WebKitGTK 6 (Perry's WebView) is not on conda-forge
# and libshumate (MapView) does not solve next to nandi-testing, so build.sh
# compiles static stub archives for both that abort with a message if a
# WebView or MapView is ever created; every other widget works.
#
# Build 1: the native compiler binary is rebuilt from Perry's source at the
# npm release's revision (perry-ext's target.json names it) with
# strip-dedup-extract.patch, and replaces the npm one; everything else (the
# runtime/stdlib/UI archives, the extension pack) is still the npm release's.
# The patch makes the link step's strip-dedup pass read libperry_ui_gtk4.a
# once in-process instead of running `llvm-ar x` once per kept member (~2,400
# runs over a 150 MB archive): a GTK4 app links in ~8 s instead of ~41 s, with
# byte-identical output. Built like Perry's release: pinned nightly via
# rustup, `--profile prod`, LLVM 22.1 linked statically (conda-forge llvmdev).
#
# $PREFIX/bin/perry is a wrapper (perry-wrapper.sh) that puts the conda
# toolchain and libraries on Perry's link line, with an rpath to this env.
# Published to prefix.dev/nandi-testing by ci/publish.py.
context:
  version: "0.5.1665"
  rev: 08b384fa365bf1a656498f629f97d6a9e688cffd
  rust: nightly-2026-10-04

package:
  name: perry
  version: ${{ version }}

build:
  number: 1
  skip: not (linux and x86_64)
  prefix_detection:
    ignore: true
  dynamic_linking:
    binary_relocation: false
  script:
    env:
      PERRY_REV: ${{ rev }}
      PERRY_RUST: ${{ rust }}
    file: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - nodejs >=20
    - zstd
    - git
    - curl
    - ca-certificates
  host:
    # Perry links LLVM statically (llvm-sys 221, inkwell)
    - llvmdev 22.1.*
    - libxml2-devel
    - libffi
    - zlib
    - zstd
  run:
    # the prebuilt compiler itself links these
    - libgcc
    - libstdcxx
    - libzlib
    - gcc_linux-64
    # Perry assembles its statepoint (GC) rewrite with `clang` from PATH
    - clang
    - pkg-config
    - gtk4 >=4.14
    - gstreamer
    - gst-plugins-base
    - pulseaudio-client
    - libsoup >=3

tests:
  - files:
      recipe:
        - test/
    script:
      - perry --version
      - test "$(perry --version)" = "perry ${{ version }}"
      - bash test/run.sh

about:
  homepage: https://github.com/PerryTS/perry
  license: MIT
  summary: Native TypeScript compiler (LLVM) with GTK4 UI and an embedded wasm interpreter
