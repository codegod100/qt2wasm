# qt2wasm as a conda package, built with pixi-build (`pixi build` here, or the
# fileapi CI job in .forge/jobs.toml, which publishes to prefix.dev/nandi-testing).
# Bump `version` here and in pyproject.toml to publish a new build.
[workspace]
name = "qt2wasm"
channels = ["conda-forge", "https://prefix.dev/nandi-testing"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[package]
name = "qt2wasm"
version = "0.2.0"
description = "Build Qt C++ into WASI WebAssembly components"
homepage = "https://fileapi.fastapicloud.dev/forge/#nandi.uk/ditherterm"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.host-dependencies]
hatchling = "*"

# The whole toolchain, prebuilt: qt6-wasi (Qt for WASI + host moc + toolchain
# file; depends on wasi-sdk), wit-bindgen, wasm-tools and the preview1 adapter
# come from prefix.dev/nandi-testing (nandi.uk/qt6-wasi), the rest from conda-forge.
[package.run-dependencies]
python = ">=3.10"
cmake = ">=3.21"
ninja = "*"
binaryen = "*"
fonttools = "*"
qt6-wasi = "6.8.3.*"
wit-bindgen = "0.46.*"
wasm-tools = "1.239.*"
wasi-preview1-adapter = "36.*"
