# fileapi forge CI (runs on Depot). On every push to main: build each recipe in
# recipes/ with rattler-build and publish the ones whose version/build number
# isn't on prefix.dev/nandi-testing yet. qt6-wasi builds qtbase twice (host
# tools + wasm32-wasip1), so it takes the forge maximum of one hour. See ci/publish.py.
# Needs the PREFIX_TOKEN secret (a prefix.dev API key; the user secret works).
[[job]]
name = "publish"
branches = ["main"]
timeout = 3600
run = "python3 ci/publish.py"

# On every push to main: build and run example/ against the published packages
# (a clean install from example/pixi.lock). See ci/example.sh.
[[job]]
name = "example"
branches = ["main"]
timeout = 1800
run = "bash ci/example.sh"
