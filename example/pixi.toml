# A minimal Qt-for-WASI program built against the published packages:
#   pixi run example     # build, then run it with the wasmtime CLI;
#                        # prints a preview, writes qt6-wasi-example.png
# Or by hand, after `pixi run build`:
#   pixi run wasmtime run --dir . build/qt6-wasi-example.wasm qt6-wasi-example.png
[workspace]
name = "qt6-wasi-example"
channels = ["conda-forge", "https://prefix.dev/nandi-testing"]
platforms = ["linux-64"]

[dependencies]
qt6-wasi = { version = "6.8.3.*", channel = "https://prefix.dev/nandi-testing" }  # + wasi-sdk, cmake, ninja
wasmtime = { version = "36.*", channel = "https://prefix.dev/nandi-testing" }      # the CLI (recipes/wasmtime)

[tasks.build]
description = "Configure with the WASI Qt's qt-cmake and build build/qt6-wasi-example.wasm"
# CMAKE_EXPORT_COMPILE_COMMANDS keeps build/compile_commands.json current, so
# clangd/Zed understands this file (Qt headers live in the pixi environment).
cmd = "$QT_WASI_PREFIX/bin/qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON && cmake --build build"
inputs = ["main.cpp", "CMakeLists.txt"]
outputs = ["build/qt6-wasi-example.wasm"]

[tasks.example]
description = "Run the example with wasmtime: prints a preview, writes qt6-wasi-example.png"
cmd = "wasmtime run --dir . build/qt6-wasi-example.wasm qt6-wasi-example.png"
depends-on = ["build"]
