[package]
name = "latha-android"
version = "0.5.0"
edition = "2021"
license = "LGPL-2.1-only OR LGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
latha-host = { path = "../latha-gui/host" }
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = "0.9"
log = "0.4"
android_logger = "0.14"
jni = "0.21"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16
strip = true

# cargo-apk (ci/android.sh): NativeActivity subclass LathaActivity for the file picker.
[package.metadata.android]
package = "uk.nandi.latha"
apk_name = "latha"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
assets = "assets"
resources = "res"

[package.metadata.android.sdk]
# memfd_create (latha:proc shared memory) is in bionic from API 30
min_sdk_version = 30
target_sdk_version = 35

[package.metadata.android.application]
label = "latha"
icon = "@mipmap/ic_launcher"
theme = "@style/LathaTheme"
extract_native_libs = true

[package.metadata.android.application.activity]
name = "uk.nandi.latha.LathaActivity"
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density"
launch_mode = "singleTask"
orientation = "unspecified"

# "Open with latha" / "Share to latha" for wasm files: the launch's file becomes
# the app (src/lib.rs, opened_file). Content URIs often carry no extension and
# file managers often call .wasm application/octet-stream, so take both and
# check the wasm magic before running it.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT"]
data = [{ mime_type = "application/wasm" }, { mime_type = "application/octet-stream" }]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
